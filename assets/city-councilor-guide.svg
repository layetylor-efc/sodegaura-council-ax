<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" role="img" aria-labelledby="t d">
<title id="t">市議会議員とは？</title><desc id="d">市民の声を聞き、市の仕事を調べ、議会で質問し、改善を提案する役割を図解</desc>
<rect width="1536" height="864" rx="48" fill="#eaf6ff"/><rect x="40" y="40" width="1456" height="784" rx="38" fill="#fff" stroke="#b9d9ee" stroke-width="8"/>
<text x="768" y="170" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="88" fill="#0b568a">市議会議員とは？</text>
<text x="768" y="245" text-anchor="middle" font-family="sans-serif" font-size="38" fill="#4f6b7e">市民と市政をつなぐ、議会のメンバー</text>
<g font-family="sans-serif" text-anchor="middle"><g transform="translate(120 330)"><rect width="290" height="300" rx="30" fill="#f0f8fd" stroke="#b9d9ee" stroke-width="5"/><text x="145" y="105" font-size="76">👂</text><text x="145" y="185" font-size="38" font-weight="700" fill="#173550">市民の声を聞く</text><text x="145" y="240" font-size="28" fill="#64798b">地域の課題や意見</text></g>
<g transform="translate(445 330)"><rect width="290" height="300" rx="30" fill="#f0f8fd" stroke="#b9d9ee" stroke-width="5"/><text x="145" y="105" font-size="76">🔎</text><text x="145" y="185" font-size="38" font-weight="700" fill="#173550">市の仕事を調べる</text><text x="145" y="240" font-size="28" fill="#64798b">事業・予算・制度</text></g>
<g transform="translate(770 330)"><rect width="290" height="300" rx="30" fill="#f0f8fd" stroke="#b9d9ee" stroke-width="5"/><text x="145" y="105" font-size="76">❓</text><text x="145" y="185" font-size="38" font-weight="700" fill="#173550">議会で質問する</text><text x="145" y="240" font-size="28" fill="#64798b">市政を確認・議論</text></g>
<g transform="translate(1095 330)"><rect width="290" height="300" rx="30" fill="#f0f8fd" stroke="#b9d9ee" stroke-width="5"/><text x="145" y="105" font-size="76">💡</text><text x="145" y="185" font-size="38" font-weight="700" fill="#173550">改善を提案する</text><text x="145" y="240" font-size="28" fill="#64798b">よりよい市政へ</text></g></g>
<text x="768" y="755" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#64798b">※活動内容の概要。最新情報は袖ケ浦市議会公式サイトをご確認ください。</text></svg>