<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="36" fill="#eef8ff"/><rect x="28" y="28" width="1144" height="564" rx="28" fill="#fff" stroke="#b7d7ee" stroke-width="3"/><text x="70" y="125" font-family="sans-serif" font-size="72" font-weight="700" fill="#083d77">市議会議員とは？</text><text x="72" y="185" font-family="sans-serif" font-size="30" font-weight="600" fill="#263746">市民の声を受け止め、まちのことを話し合い、決める人</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(80 255)"><rect width="235" height="220" rx="28" fill="#f5fbff" stroke="#c8e0f1"/><circle cx="117" cy="75" r="48" fill="#dff0ff"/><text x="117" y="91" font-size="45">👂</text><text x="117" y="158" font-size="30" font-weight="700" fill="#083d77">聞く</text><text x="117" y="193" font-size="19" fill="#52677a">市民の声を受け止める</text></g><g transform="translate(340 255)"><rect width="235" height="220" rx="28" fill="#f5fbff" stroke="#c8e0f1"/><circle cx="117" cy="75" r="48" fill="#dff0ff"/><text x="117" y="91" font-size="45">🔎</text><text x="117" y="158" font-size="30" font-weight="700" fill="#083d77">調べる</text><text x="117" y="193" font-size="19" fill="#52677a">予算や制度を確認する</text></g><g transform="translate(600 255)"><rect width="235" height="220" rx="28" fill="#f5fbff" stroke="#c8e0f1"/><circle cx="117" cy="75" r="48" fill="#dff0ff"/><text x="117" y="91" font-size="45">❓</text><text x="117" y="158" font-size="30" font-weight="700" fill="#083d77">質問</text><text x="117" y="193" font-size="19" fill="#52677a">議会で市政を問う</text></g><g transform="translate(860 255)"><rect width="235" height="220" rx="28" fill="#f5fbff" stroke="#c8e0f1"/><circle cx="117" cy="75" r="48" fill="#dff0ff"/><text x="117" y="91" font-size="45">💡</text><text x="117" y="158" font-size="30" font-weight="700" fill="#083d77">提案</text><text x="117" y="193" font-size="19" fill="#52677a">よりよいまちを考える</text></g></g><text x="70" y="550" font-family="sans-serif" font-size="22" fill="#5c7287">※市役所職員とは役割が異なります</text></svg>