an></a><a class="restore-eyecatch" href="#faction" data-go="faction"><img src="assets/faction-guide.svg?v='+release+'" alt="会派とは？ 市議会の中で考えや目的が近い議員が一緒に活動するグループ"><strong>会派とは？</strong><span>画像でやさしく見る ›</span></a></div>';const marker='<div class="panel"><h2>知りたいことから選ぶ</h2>';if(h.includes(marker))h=h.replace(marker,eye+marker);const rule='<div class="fullpath-rule"><h3>🔗 URLの「フルパス」表記ルール</h3><div>このダッシュボードでは、フルパスとは「リンク名だけで隠さず、コピーできる完全なURL文字列をそのまま表示すること」と定義します。Googleスプレッドシートの特定タブは、原則として <b>#gid=...</b> まで含めます。</div><small>原則：クリック用リンク ＋ コピー可能な生URLを併記</small><code>https://docs.google.com/spreadsheets/d/1jQFbQLZPWfbNS2da44jNa4lCIdXnAe-zCianIGB5gY8/edit</code></div>';const qamarker='<section id="qa" class="view">';if(h.includes(qamarker))h=h.replace(qamarker,qamarker+rule);document.open();document.write(h);document.close();}catch(e){document.getElementById('loading').innerHTML='読み込みに失敗しました。<a href="dashboard.html?release='+release+'">こちらから開いてください</a>。';}})();</script></body></html>
